name: DART 공시 알림 시스템

on:
  # Google Apps Script (google_apps_script.js)에서 정시마다 workflow_dispatch로 즉시 깨움 (지연 0초)
  workflow_dispatch:

jobs:
  dart-notification:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load bot state from bot-state branch
        run: |
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state:refs/remotes/origin/bot-state
            git checkout refs/remotes/origin/bot-state -- sent.json 2>/dev/null || true
            git reset HEAD sent.json 2>/dev/null || true
          elif [ ! -f sent.json ]; then
            git show HEAD~1:sent.json > sent.json 2>/dev/null || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DART notification
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Save bot state to bot-state branch (Keep main clean)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          mkdir -p /tmp/state-files
          for f in sent.json ipo_sent.json news_sent.json us_stock_profiles.json; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/state-files/
            fi
          done

          git worktree add --detach /tmp/bot-state
          cd /tmp/bot-state
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state:refs/remotes/origin/bot-state
            git checkout -B bot-state refs/remotes/origin/bot-state
          else
            git checkout --orphan bot-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp /tmp/state-files/* . 2>/dev/null || true
          for f in sent.json ipo_sent.json news_sent.json us_stock_profiles.json; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "📊 DART 발송 이력 업데이트 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git push origin HEAD:refs/heads/bot-state
          else
            echo "변경사항 없음"
          fi
