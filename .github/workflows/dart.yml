name: DART 공시 알림 시스템

on:
  # Google Apps Script (google_apps_script.js)에서 정시마다 workflow_dispatch로 즉시 깨움 (지연 0초)
  # GitHub 자체 schedule은 수 시간 지연 실행되므로 비활성화 처리
  # schedule:
  #   - cron: '*/30 23 * * 0-4'
  #   - cron: '*/30 0-9 * * 1-5'
  #   - cron: '0 10 * * 1-5'
  
  # 외부 API(Google Apps Script) 및 수동 트리거
  workflow_dispatch:

jobs:
  dart-notification:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul
    
    steps:
      # 1단계: 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2단계: Python 3.11 설정
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3단계: 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4단계: DART 공시 알림 실행
      - name: Run DART notification
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py
      
      # 5단계: 변경사항 커밋 (sent.json 업데이트)
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain sent.json)" ]; then
            git add sent.json
            git commit -m "📊 발송 이력 업데이트 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git pull --rebase origin main || true
            git push
          else
            echo "변경사항 없음"
          fi
        continue-on-error: true
