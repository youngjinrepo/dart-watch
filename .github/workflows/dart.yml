name: DART 공시 알림 시스템

on:
  schedule:
    # GitHub Actions cron은 UTC 기준 (KST = UTC + 9시간)
    # DART 공시 접수/공개 시간(평일 KST 08:00~19:00 = UTC 23:00~10:00)에만 실행
    # (19시 이후 제출분은 익일 07:30 이후 공개되므로 야간/새벽/주말 불필요 실행 제거)
    - cron: '*/15 23 * * 0-4'   # KST 월~금 08:00 ~ 08:45 (15분 간격)
    - cron: '*/15 0-9 * * 1-5'  # KST 월~금 09:00 ~ 18:45 (15분 간격)
    - cron: '0 10 * * 1-5'      # KST 월~금 19:00 마감 확인
  
  # 수동 트리거 허용
  workflow_dispatch:

jobs:
  dart-notification:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul
    
    steps:
      # 1단계: 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2단계: Python 3.11 설정
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3단계: 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4단계: DART 공시 알림 실행
      - name: Run DART notification
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py
      
      # 5단계: 변경사항 커밋 (sent.json 업데이트)
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain sent.json)" ]; then
            git add sent.json
            git commit -m "📊 발송 이력 업데이트 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git pull --rebase origin main || true
            git push
          else
            echo "변경사항 없음"
          fi
        continue-on-error: true
