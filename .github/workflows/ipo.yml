name: 공모주(IPO) 수요예측 분석 알림

on:
  # Google Apps Script (google_apps_script.js)에서 정시마다 workflow_dispatch로 즉시 깨움 (지연 0초)
  # GitHub 자체 schedule은 수 시간 지연 실행되므로 비활성화 처리
  # schedule:
  #   - cron: '30 23 * * 0-4'  # KST 월~금 08:30
  #   - cron: '0 7 * * 1-5'    # KST 월~금 16:00
  #   - cron: '0 11 * * 1-5'   # KST 월~금 20:00

  # 외부 API(Google Apps Script) 및 수동 트리거
  workflow_dispatch:

jobs:
  ipo-notification:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO demand forecast analysis
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ipo_main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ -n "$(git status --porcelain ipo_sent.json)" ]; then
            git add ipo_sent.json
            git commit -m "🏛️ 공모주 발송 이력 업데이트 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git pull --rebase origin main || true
            git push
          else
            echo "변경사항 없음"
          fi
        continue-on-error: true
