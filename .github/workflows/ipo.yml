name: 공모주(IPO) 수요예측 분석 알림

on:
  # Google Apps Script (google_apps_script.js)에서 정시마다 workflow_dispatch로 즉시 깨움 (지연 0초)
  workflow_dispatch:

jobs:
  ipo-notification:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load bot state from bot-state branch
        run: |
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state
            git checkout origin/bot-state -- ipo_sent.json 2>/dev/null || true
            git reset HEAD ipo_sent.json 2>/dev/null || true
          elif [ ! -f ipo_sent.json ]; then
            git show HEAD~1:ipo_sent.json > ipo_sent.json 2>/dev/null || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO demand forecast analysis
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ipo_main.py

      - name: Save bot state to bot-state branch (Keep main clean)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          mkdir -p /tmp/state-files
          for f in sent.json ipo_sent.json news_sent.json us_stock_profiles.json; do
            [ -f "$f" ] && cp "$f" /tmp/state-files/
          done

          git worktree add --detach /tmp/bot-state
          cd /tmp/bot-state
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state
            git checkout -B bot-state origin/bot-state
          else
            git checkout --orphan bot-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp /tmp/state-files/* . 2>/dev/null || true
          git add -f sent.json ipo_sent.json news_sent.json us_stock_profiles.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "🏛️ 공모주 발송 이력 업데이트 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git pull --rebase origin bot-state 2>/dev/null || true
            git push origin bot-state
          else
            echo "변경사항 없음"
          fi
        continue-on-error: true
